repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  # Local hook so formatting uses the Prettier pinned in web/package-lock.json (mirrors-prettier lags).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --prefix web prettier --write
        language: system
        files: ^web/
        exclude: ^web/(src/api/|package-lock\.json)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
