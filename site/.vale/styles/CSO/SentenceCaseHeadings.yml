extends: capitalization
message: "'%s' should be in sentence case."
level: error
scope: heading
match: $sentence
# No ":" indicator: a heading such as "Quickstart: the replay demo" keeps the text after
# the colon in lower case, which is the house style.
exceptions:
  # Type names in the schema reference pages (CamelCase identifiers).
  - '[A-Z][a-z]+(?:[A-Z][a-z]+)+'
  - I
  - IAM
  - DNS
  - PyPI
  - TestPyPI
  - Hostinger
  # AWS region name "US East (N. Virginia)".
  - US
  - East
  - N
  - Virginia
  - API
  - AWS
  - Amazon
  - Apache
  - Bedrock
  - Builder Center
  - CLI
  - Claude
  - Compose
  - Decider
  - Diátaxis
  - Docker
  - GitHub
  - GPU
  - CPU
  - Haiku
  - Hindi
  - HTTP
  - JSON
  - MapRoulette
  - OSM
  - OpenAPI
  - OpenStreetMap
  - Python
  - Qwen
  - REST
  - SQLite
  - Starlight
  - Strands
  - October
  - TODO
  - UI
  - URL
  - User-Agent
