version: 2

# One weekly run per ecosystem and directory, and one grouped pull request for each. Major versions
# of the base images and of a few tools that tend to break the build (eslint, jsdom, size-limit,
# sqlalchemy) are ignored by default and are upgraded by hand when there is time to test them;
# minor and patch updates still arrive. Third party actions are pinned to full commit SHAs (with the
# tag in a trailing comment) and Dependabot rewrites both. A cooldown skips releases younger than a
# few days, which is the cheapest defence against a just-published malicious version.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "python"]

  - package-ecosystem: "uv"
    directory: "/patterns/calibrated_action_gate"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      pattern-python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "python"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "size-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@size-limit/file"
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "size-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@size-limit/file"
        update-types: ["version-update:semver-major"]
    groups:
      site-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "docker"
    directories:
      - "/infra/compose"
      - "/infra/aws-serverless-demo"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "litestream/litestream"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(infra)"
    labels: ["dependencies", "infra"]

  - package-ecosystem: "docker-compose"
    directory: "/infra/compose"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "litestream/litestream"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(infra)"
    labels: ["dependencies", "infra"]
