name: dependency review

# Blocks a pull request that adds a dependency with a known high severity advisory or a GPL or AGPL
# licence. The dependency graph API behind it needs GitHub Advanced Security on a private repository,
# so the job is skipped until the repository is public or ENABLE_ADVANCED_SECURITY is "true".

on:
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "web/package.json"
      - "web/package-lock.json"
      - "site/package.json"
      - "site/package-lock.json"
      - "infra/**/*Dockerfile"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  review:
    name: dependency-review
    if: github.event.repository.private == false || vars.ENABLE_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the summary comment
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
