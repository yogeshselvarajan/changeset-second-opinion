name: release
# Manual runs and release tags only; a push to this file registers it with GitHub Actions.

# Builds and publishes a release. It is started by release-please.yml for each new tag, or by hand from
# the Actions tab: choose a tag in "Use workflow from".
#   target auto        stable tag -> PyPI, pre-release tag (v1.2.0-rc.1) -> TestPyPI, plus images,
#                      docs site and GitHub Release assets
#   target testpypi    publish to TestPyPI only (a dry run of the publishing setup). From a tag it
#                      publishes that version. From a branch such as main it builds a throwaway
#                      dev version (1.0.0.devN), pushes no images and makes no GitHub Release.
#   target build-only  build and check everything, publish nothing (works from any branch)
# PyPI uses Trusted Publishing (OIDC): there is no PyPI token anywhere. The publishing jobs run in the
# `pypi` and `testpypi` environments, where a required reviewer approves each publish.
# Signed build provenance and SBOM attestations need a public repository; those steps are skipped
# while the repository is private.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to do with the build
        type: choice
        default: auto
        options:
          - auto
          - testpypi
          - build-only

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/changeset-second-opinion

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
      push_images: ${{ steps.plan.outputs.push_images }}
      devbuild: ${{ steps.plan.outputs.devbuild }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Plan the release and check the versions agree with the tag
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import json, os, re, sys, tomllib
          from packaging.version import Version

          target, ref_type, ref = os.environ["TARGET"], os.environ["REF_TYPE"], os.environ["REF_NAME"]
          out = open(os.environ["GITHUB_OUTPUT"], "a")

          def emit(**kw):
              for k, v in kw.items():
                  out.write(f"{k}={v}\n")

          if ref_type != "tag":
              if target == "build-only":
                  emit(tag="", version="0.0.0.dev0", prerelease="true", publish="none", release="false",
                       push_images="false", devbuild="false")
                  sys.exit(0)
              if target == "testpypi":
                  # Dry run of the publishing setup from a branch: a throwaway PEP 440 dev version
                  # (for example 1.0.0.dev7), published to TestPyPI only. No images are pushed and
                  # no GitHub Release is made.
                  base = Version(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])
                  dev = f"{base.base_version}.dev{os.environ['RUN_NUMBER']}"
                  emit(tag="", version=dev, prerelease="true", publish="testpypi", release="false",
                       push_images="false", devbuild="true")
                  sys.exit(0)
              sys.exit("::error::Choose a tag in 'Use workflow from', or use the target testpypi or build-only.")

          if not re.fullmatch(r"v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", ref):
              sys.exit(f"::error::Tag {ref} is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease.")
          tag_version = Version(ref[1:])
          py_version = Version(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])
          js_version = Version(json.load(open("web/package.json"))["version"])
          for name, v in (("backend/pyproject.toml", py_version), ("web/package.json", js_version)):
              if v != tag_version:
                  sys.exit(f"::error::{name} says {v} but the tag is {ref}.")

          prerelease = tag_version.is_prerelease
          if target == "auto":
              publish = "testpypi" if prerelease else "pypi"
          elif target == "testpypi":
              publish = "testpypi"
          else:
              publish = "none"
          emit(tag=ref, version=str(tag_version), prerelease=str(prerelease).lower(),
               publish=publish, release=str(target == "auto").lower(),
               push_images=str(publish != "none").lower(), devbuild="false")
          PY

  build-python:
    name: build-python
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # signed attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          sync: "false"
      - name: Licence check on the runtime dependencies
        run: bash .github/scripts/license_check.sh
      - name: Dry run only, set a throwaway dev version in the checked out pyproject.toml
        if: needs.prepare.outputs.devbuild == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("backend/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new, count = re.subn(r'(?m)^version = "[^"]+"', f'version = "{os.environ["VERSION"]}"', text, count=1)
          assert count == 1, "version line not found"
          path.write_text(new, encoding="utf-8")
          print("version set to", os.environ["VERSION"])
          PY
      - name: Build sdist and wheel, twine check, inspect the wheel, install it in a clean environment
        run: bash .github/scripts/package_check.sh backend "$RUNNER_TEMP/dist"
      - name: Software bill of materials (CycloneDX) from the lock file
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: backend
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-python.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance attestation for the distributions
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
      - name: SBOM attestation for the distributions
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*
          sbom-path: ${{ runner.temp }}/sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: ${{ runner.temp }}/sbom-python.cdx.json
          if-no-files-found: error

  build-docs:
    name: build-docs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # last-updated dates come from git
          persist-credentials: false
      - uses: ./.github/actions/setup-web
        with:
          web: "false"
          site: "true"
      - name: Build the docs site
        working-directory: site
        env:
          DOCS_BASE: /docs
        run: npm run build
      - name: Pack the site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          tar -czf "$RUNNER_TEMP/docs/docs-site-${VERSION}.tar.gz" -C site/dist .
      - name: Build provenance attestation for the docs archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/docs/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs/
          if-no-files-found: error

  images:
    name: image-${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: infra/compose/backend.Dockerfile
          - name: web
            dockerfile: infra/compose/web.Dockerfile
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        if: needs.prepare.outputs.push_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Signed provenance attestation, stored with the image
        if: ${{ needs.prepare.outputs.push_images == 'true' && !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-testpypi:
    name: publish-testpypi
    needs: [prepare, build-python, build-docs, images]
    if: needs.prepare.outputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/changeset-second-opinion/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: publish-pypi
    needs: [prepare, build-python, build-docs, images]
    if: needs.prepare.outputs.publish == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/changeset-second-opinion/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: github-release
    needs: [prepare, build-python, build-docs, images, publish-pypi, publish-testpypi]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      - name: Create or update the GitHub Release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cp artifacts/python-dist/* artifacts/sbom-python/* artifacts/docs-site/* assets/
          cp CHANGELOG.md assets/CHANGELOG.md
          (cd assets && sha256sum -- * | grep -v ' SHA256SUMS$' > SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--verify-tag --generate-notes)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" --title "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" assets/* --clobber
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${TAG}" >>"$GITHUB_STEP_SUMMARY"

  deploy-demo:
    name: deploy-demo
    needs: [prepare, github-release]
    if: >-
      needs.prepare.outputs.release == 'true' && needs.prepare.outputs.prerelease == 'false'
      && vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-demo.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
