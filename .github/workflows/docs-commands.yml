name: docs commands still work
# Scheduled and manual runs only; a push to this file registers it with GitHub Actions.

# Runs the shell blocks the docs mark as tested (the fence says `sh test`), nightly, so a Quickstart
# that has rotted fails here and not in front of a new reader.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-web
        with:
          web: "false"
      - name: Run the tested blocks
        working-directory: site
        run: node scripts/run-tested-commands.mjs
