[project]
name = "calibrated-action-gate"
version = "0.1.0"
description = "Calibrated action gate: typed Strands Decider questions, strict validation, permutation aggregation and decision receipts"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibrated_action_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
