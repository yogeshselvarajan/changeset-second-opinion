AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time setup for the demo deploy workflow (.github/workflows/deploy-demo.yml): the GitHub OIDC
  identity provider (optional) and an IAM role that only the "demo" environment of one repository can
  assume. No long-lived access key exists. Deploy this once, in the account that hosts the demo.

Parameters:
  GitHubOwner:
    Type: String
    Default: yogeshselvarajan
    AllowedPattern: "^[A-Za-z0-9-]{1,39}$"
    Description: GitHub user or organisation that owns the repository.
  GitHubRepository:
    Type: String
    Default: changeset-second-opinion
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"
    Description: Repository name.
  GitHubOwnerId:
    Type: String
    Default: "77218020"
    AllowedPattern: "^[0-9]{1,20}$"
    Description: Numeric id of the GitHub owner (gh api users/OWNER --jq .id). Used by the immutable subject form.
  GitHubRepositoryId:
    Type: String
    Default: "1423035413"
    AllowedPattern: "^[0-9]{1,20}$"
    Description: Numeric id of the repository (gh api repos/OWNER/REPO --jq .id). Used by the immutable subject form.
  GitHubEnvironment:
    Type: String
    Default: demo
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"
    Description: Name of the GitHub environment whose jobs may assume the role.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false when this account already has the token.actions.githubusercontent.com provider (an account can have only one).
  DemoStackName:
    Type: String
    Default: cso-demo
    AllowedPattern: "^[A-Za-z][A-Za-z0-9-]{0,30}$"
    Description: Name of the CloudFormation stack the deploy script creates.
  EcrRepositoryName:
    Type: String
    Default: cso-lwa-api
    Description: ECR repository the deploy script pushes the API image to.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${DemoStackName}-github-deploy
      Description: Assumed by GitHub Actions (environment-scoped) to deploy the serverless replay demo.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Both subject shapes: the classic name form, and the immutable id form GitHub
                # emits when the repository uses immutable subject claims.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-demo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                Resource: !Sub arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/${EcrRepositoryName}
              - Sid: StackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:TagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${DemoStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${DemoStackName}-*/*
              - Sid: TransformAndValidate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: SiteBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketCORS
                  - s3:GetBucketCORS
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${DemoStackName}-*
              - Sid: SiteObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DemoStackName}-*/*
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:PublishVersion
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:EnableReplication
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${DemoStackName}-*
              - Sid: LogsAndEvents
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - logs:TagResource
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:TagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${DemoStackName}-*
                  - !Sub arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/${DemoStackName}-*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: StackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DemoStackName}-*
              - Sid: PassStackRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DemoStackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - edgelambda.amazonaws.com
              - Sid: EdgeServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - replicator.lambda.amazonaws.com
                      - logger.cloudfront.amazonaws.com
              - Sid: CloudFrontAndAlerts
                Effect: Allow
                # CloudFront identifiers do not exist before the stack creates them, so these cannot be
                # narrowed to one resource. They are limited to CloudFront, SNS, CloudWatch and Budgets.
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:CreateCachePolicy
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - sns:CreateTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                  - acm:DescribeCertificate
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Put this value in the repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  OidcSubject:
    Description: The token subject the role trusts.
    Value: !Sub repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}
