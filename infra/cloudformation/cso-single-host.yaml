AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Changeset Second Opinion, single host (ADR-007): one EC2 instance running docker compose
  (Caddy, API, worker, Strands Decider), an Elastic IP, a versioned backup bucket with continuous
  database replication, secrets in SSM Parameter Store, CloudWatch logs and alarms, a budget guard,
  a nightly stop and nightly volume snapshots. No SSH, only 443/tcp inbound.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Application }
        Parameters: [Stage, DomainName, RepoUrl, GitRef]
      - Label: { default: Host }
        Parameters: [InstanceType, AmiId, RootVolumeGiB, VpcId, SubnetId]
      - Label: { default: Operations }
        Parameters: [BackupBucketName, AlertEmail, BudgetUsd, EnableNightlyStop]

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    Description: >-
      Name of this deployment. Settings and secrets are read from SSM Parameter Store under
      /cso/<Stage>/ (user_agent, osm_oauth_client_id, osm_oauth_client_secret, and so on; see
      the "Deploy on AWS" page of the docs site).
  InstanceType:
    Type: String
    Default: g6.xlarge
    AllowedValues: [g6.xlarge, g5.xlarge, c7i.2xlarge]
    Description: g6.xlarge (NVIDIA L4) is the plan. g5.xlarge if g6 capacity is short, c7i.2xlarge is the CPU fallback.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id
    Description: Public SSM parameter for the Deep Learning Base OSS Nvidia Driver AMI (Ubuntu 24.04). Also boots on the CPU type.
  RootVolumeGiB:
    Type: Number
    Default: 100
    MinValue: 80
    MaxValue: 500
    Description: Root volume size. The AMI snapshot is 75 GiB, so the plan's 60 GiB cannot launch. Holds the OS, images, model cache and database.
  DomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$'
    Description: Public DNS name that you will point at the Elastic IP (the certificate is issued for it).
  RepoUrl:
    Type: String
    Default: https://github.com/yogeshselvarajan/changeset-second-opinion.git
    AllowedPattern: '^https://[^\s"'']+$'
    Description: HTTPS git URL. A private repository needs the optional SecureString /cso/<Stage>/git_token (see the "Deploy on AWS" page of the docs site).
  GitRef:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Branch or tag to deploy. Prefer a release tag.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the host.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (auto-assigns public IPv4 or has a route to an internet gateway) in an AZ with capacity for the instance type.
  BackupBucketName:
    Type: String
    Default: ""
    Description: Optional fixed name for the backup bucket. Leave empty to let CloudFormation name it.
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Receives budget alerts and the status-check alarm (each subscription needs a confirmation click).
  BudgetUsd:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Monthly cost budget in USD. Alerts when actual spend passes 20 USD, 50 USD, 80 percent and 100 percent of this amount.
  EnableNightlyStop:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Stop the instance every night at 23:00 India time (start it again with infra/scripts/start.sh).

Conditions:
  HasBucketName: !Not [!Equals [!Ref BackupBucketName, ""]]
  NightlyStop: !Equals [!Ref EnableNightlyStop, "true"]
  HasGpu: !Or
    - !Equals [!Ref InstanceType, g6.xlarge]
    - !Equals [!Ref InstanceType, g5.xlarge]

Resources:
  # ------------------------------------------------------------------ network
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CSO host. Only HTTPS in, no SSH (administration is SSM Session Manager).
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTPS to Caddy
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-host" }
        - { Key: project, Value: cso }

  # ------------------------------------------------------------------ identity
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Instance role for the CSO host (Bedrock, logs, SSM parameters, backups, SSM agent).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cso-least-privilege
          PolicyDocument:
            # Narrow permissions: the model invoke actions, SSM parameters and the backup bucket.
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cso/*"
              # Settings and secrets of this deployment only (/cso/<Stage>/). The SecureString
              # values are decrypted with the account's default SSM key, and only through SSM.
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cso/${Stage}/*"
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
              # The nightly dump (backups/) is write only. Litestream (litestream/) also reads, to
              # restore, and deletes what is older than its 24 hour retention.
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub "${BackupBucket.Arn}/backups/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${BackupBucket.Arn}/litestream/*"
              - Effect: Allow
                Action: [s3:GetBucketLocation]
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix": ["litestream/*", "litestream"]
              - Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: "*"
                Condition:
                  StringEquals:
                    "cloudwatch:namespace": CSO
      Tags:
        - { Key: project, Value: cso }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ------------------------------------------------------------------ host
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref HostSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      # No key pair: there is no SSH. Use `aws ssm start-session`.
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeGiB
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required # IMDSv2 only
        HttpEndpoint: enabled
        # Containers sit one network hop behind the host; hop limit 1 would hide the instance role from them.
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p /etc/cso /opt/cso
          cat > /etc/cso/bootstrap.env <<'ENVFILE'
          CSO_STAGE=${Stage}
          CSO_DOMAIN=${DomainName}
          CSO_REPO_URL=${RepoUrl}
          CSO_GIT_REF=${GitRef}
          CSO_BACKUP_BUCKET=${BackupBucket}
          CSO_AWS_REGION=${AWS::Region}
          CSO_INSTANCE_TYPE=${InstanceType}
          ENVFILE
          chmod 0644 /etc/cso/bootstrap.env
          apt-get update -y
          apt-get install -y git curl unzip
          # Optional deploy token for a private repository (SecureString /cso/<Stage>/git_token).
          # Held in a shell variable for one clone and never stored in git config or on disk.
          token=$(aws ssm get-parameter --name /cso/${Stage}/git_token --with-decryption --region ${AWS::Region} --query Parameter.Value --output text 2>/dev/null || true)
          if [ -n "$token" ]; then
            git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$token" | base64 -w0)" clone ${RepoUrl} /opt/cso
          else
            git clone ${RepoUrl} /opt/cso
          fi
          cd /opt/cso && git checkout ${GitRef}
          bash /opt/cso/infra/scripts/bootstrap.sh >> /var/log/cso-bootstrap.log 2>&1
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-host" }
        - { Key: project, Value: cso }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: project, Value: cso }

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Host

  # ------------------------------------------------------------------ storage and logs
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain # the backups outlive the stack
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasBucketName, !Ref BackupBucketName, !Ref "AWS::NoValue"]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Litestream removes its own old generations; on a versioned bucket those deletions
          # leave older versions behind, which this rule clears after 30 days.
          - Id: expire-replica-versions
            Status: Enabled
            Prefix: litestream/
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: project, Value: cso }

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cso/app
      RetentionInDays: 14
      Tags:
        - { Key: project, Value: cso }

  # EBS snapshots of the instance's volumes, nightly, 7 kept (the S3 backup is the file-level copy).
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Nightly snapshot of the CSO host - 7 kept
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - { Key: project, Value: cso }
        Schedules:
          - Name: nightly
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times: ["17:15"]
            RetainRule:
              Count: 7

  # ------------------------------------------------------------------ cost and health guards
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CSO alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - { Key: project, Value: cso }

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetUsd
          Unit: USD
      # Four notifications (the service allows five): two fixed amounts, then 80 and 100 percent of
      # the budget. The budget covers the whole account's spend rather than only this stack's tag:
      # a tag filter needs the "project" cost allocation tag to be switched on in Billing first,
      # and until it is, a filtered budget sees nothing and never warns.
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 20
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The host failed its EC2 status checks.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - { Name: InstanceId, Value: !Ref Host }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching # a stopped instance publishes no data
      AlarmActions: [!Ref AlertTopic]

  BackupFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The nightly backup did not report success (metric CSO/BackupSuccess).
      Namespace: CSO
      MetricName: BackupSuccess
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching # no data while the host is stopped
      AlarmActions: [!Ref AlertTopic]

  # ------------------------------------------------------------------ what the host is doing
  # Caddy writes one JSON line per request to stdout (infra/caddy/Caddyfile); docker ships it to
  # /cso/app. Two counters make the error ratio; the host probe (infra/scripts/probe.sh) publishes
  # the other metrics every minute.
  Http5xxFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: "{ $.status >= 500 }"
      MetricTransformations:
        - { MetricNamespace: CSO, MetricName: Http5xx, MetricValue: "1", DefaultValue: 0 }

  HttpRequestsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: "{ $.status = * }"
      MetricTransformations:
        - { MetricNamespace: CSO, MetricName: HttpRequests, MetricValue: "1", DefaultValue: 0 }

  Http5xxRatioAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More than 5 percent of requests failed with a 5xx status over 5 minutes (at least 20 requests).
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      Metrics:
        - Id: ratio
          Expression: IF(requests >= 20, 100 * errors / requests, 0)
          Label: 5xx percent
          ReturnData: true
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric: { Namespace: CSO, MetricName: Http5xx }
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric: { Namespace: CSO, MetricName: HttpRequests }
            Period: 300
            Stat: Sum

  ReadyzFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API's /readyz has not answered 200 for 3 minutes (database or Decider down, or the host probe stopped).
      Namespace: CSO
      MetricName: ReadyzOk
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # A stopped host publishes nothing; with the nightly stop that is normal, without it silence is a failure.
      TreatMissingData: !If [NightlyStop, notBreaching, breaching]
      AlarmActions: [!Ref AlertTopic]

  DiskUsedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The root volume is more than 80 percent full.
      Namespace: CSO
      MetricName: DiskUsedPercent
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GpuMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGpu
    Properties:
      AlarmDescription: GPU memory use is above 90 percent (the Decider may stop answering).
      Namespace: CSO
      MetricName: GpuMemoryPercent
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ------------------------------------------------------------------ nightly stop
  StopSchedulerRole:
    Type: AWS::IAM::Role
    Condition: NightlyStop
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: stop-the-host
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:StopInstances]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}"

  NightlyStopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: NightlyStop
    Properties:
      Description: Stop the CSO host at 23:00 India time to save compute cost.
      ScheduleExpression: cron(0 23 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt StopSchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${Host}"]}'

Outputs:
  InstanceId:
    Value: !Ref Host
    Description: Used by infra/scripts (SSM Run Command, start and stop).
  PublicIp:
    Value: !Ref ElasticIp
    Description: Point the DNS A record for DomainName at this address.
  DomainName:
    Value: !Ref DomainName
  Url:
    Value: !Sub "https://${DomainName}"
  BackupBucket:
    Value: !Ref BackupBucket
    Description: Retained on stack delete.
  LogGroup:
    Value: !Ref AppLogGroup
  SettingsPath:
    Value: !Sub "/cso/${Stage}/"
    Description: SSM Parameter Store path for settings and secrets (see the "Deploy on AWS" page of the docs site).
