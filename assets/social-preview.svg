<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Changeset Second Opinion</title>
  <desc id="d">A second opinion on flagged OpenStreetMap changesets. Evidence first; a human posts.</desc>
  <!-- Brand tokens from web/src/tokens.css: canvas #f6f5f2, surface #ffffff, line #e2dfd8, ink #1b1a17, ink-2 #6b6960, accent #4e5bd8 -->
  <rect width="1280" height="640" fill="#f6f5f2"/>
  <!-- faint map lines, decorative -->
  <g fill="none" stroke="#e8e3d6" stroke-width="14" stroke-linecap="round">
    <path d="M700 -20 C 820 160, 1000 120, 1120 300 S 1260 520, 1320 560"/>
    <path d="M560 660 C 700 520, 900 560, 1040 420 S 1200 200, 1300 160"/>
  </g>
  <path d="M0 0H1280" stroke="#4e5bd8" stroke-width="8"/>

  <!-- mark -->
  <g transform="translate(88 96) scale(3.6)">
    <rect fill="#4E5BD8" x="0" y="0" width="12" height="5" rx="2.5"/>
    <rect fill="#8E8B83" x="0" y="8" width="24" height="5" rx="2.5"/>
    <rect fill="#8E8B83" x="0" y="16" width="18" height="5" rx="2.5"/>
  </g>

  <text x="88" y="298" font-family="'Fraunces Variable', Fraunces, Georgia, serif" font-size="84" font-weight="600" fill="#1b1a17">Changeset</text>
  <text x="88" y="388" font-family="'Fraunces Variable', Fraunces, Georgia, serif" font-size="84" font-weight="600" fill="#4e5bd8">Second Opinion</text>
  <text x="88" y="452" font-family="'Inter Variable', Inter, 'Segoe UI', sans-serif" font-size="28" fill="#1b1a17">A second opinion on flagged OpenStreetMap edits.</text>
  <text x="88" y="498" font-family="'Inter Variable', Inter, 'Segoe UI', sans-serif" font-size="26" fill="#6b6960">Evidence first. A person decides and posts.</text>

  <!-- lane chips: same colours as the queue lanes -->
  <g font-family="'Inter Variable', Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <rect x="88" y="552" width="190" height="38" rx="19" fill="#f8efd8"/>
    <text x="183" y="577" text-anchor="middle" fill="#7a4b00">Review suggested</text>
    <rect x="290" y="552" width="230" height="38" rx="19" fill="#e9edf6"/>
    <text x="405" y="577" text-anchor="middle" fill="#1e3a8a">Needs local knowledge</text>
    <rect x="532" y="552" width="170" height="38" rx="19" fill="#e8f0ea"/>
    <text x="617" y="577" text-anchor="middle" fill="#14532d">Looks consistent</text>
  </g>

  <!-- card: ten questions, every probability shown -->
  <g transform="translate(852 130) scale(0.86)">
    <rect width="400" height="400" rx="16" fill="#ffffff" stroke="#e2dfd8" stroke-width="2"/>
    <g font-family="'Inter Variable', Inter, 'Segoe UI', sans-serif">
      <text x="28" y="52" font-size="20" font-weight="600" fill="#1b1a17">Ten questions</text>
      <text x="372" y="52" font-size="16" text-anchor="end" fill="#6b6960">every answer shown</text>
      <g font-size="17" fill="#1b1a17">
        <text x="28" y="100">Account under a week old</text>
        <text x="28" y="146">Comment matches changes</text>
        <text x="28" y="192">Old feature deleted</text>
        <text x="28" y="238">Mass retag of one key</text>
        <text x="28" y="284">Evidence sufficient</text>
      </g>
      <g fill="#e2dfd8">
        <rect x="28" y="108" width="344" height="8" rx="4"/>
        <rect x="28" y="154" width="344" height="8" rx="4"/>
        <rect x="28" y="200" width="344" height="8" rx="4"/>
        <rect x="28" y="246" width="344" height="8" rx="4"/>
        <rect x="28" y="292" width="344" height="8" rx="4"/>
      </g>
      <g fill="#4e5bd8">
        <rect x="28" y="108" width="52" height="8" rx="4"/>
        <rect x="28" y="154" width="296" height="8" rx="4"/>
        <rect x="28" y="200" width="30" height="8" rx="4"/>
        <rect x="28" y="246" width="18" height="8" rx="4"/>
        <rect x="28" y="292" width="262" height="8" rx="4"/>
      </g>
      <line x1="28" y1="326" x2="372" y2="326" stroke="#e2dfd8" stroke-width="2"/>
      <text x="28" y="364" font-size="16" fill="#6b6960">Never writes to OpenStreetMap</text>
    </g>
  </g>

  <text x="1192" y="590" text-anchor="end" font-family="'JetBrains Mono Variable', 'JetBrains Mono', Consolas, monospace" font-size="18" fill="#6b6960">Apache-2.0 · open source</text>
</svg>
